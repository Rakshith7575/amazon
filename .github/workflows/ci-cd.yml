name: Amazon Homepage CI/CD

on:
  push:
    branches:
      - main

jobs:

  # JOB 1
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


  # JOB 2
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: |
          test -f index.html
          echo "HTML file exists"

      - name: Check CSS File
        run: |
          test -f style.css
          echo "CSS file exists"


  # JOB 3
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t amazon-homepage .


  # JOB 4
  docker-test:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t amazon-homepage .

      - name: Run Container
        run: |
          docker run -d \
            --name amazon-test \
            -p 8080:80 \
            amazon-homepage

      - name: Test Website
        run: |
          sleep 5
          curl http://localhost:8080

      - name: Stop Container
        run: |
          docker stop amazon-test
          docker rm amazon-test


  # JOB 5
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-test

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/amazon-homepage

            git pull origin main

            docker stop amazon-web || true
            docker rm amazon-web || true

            docker build -t amazon-homepage .

            docker run -d \
              --name amazon-web \
              -p 80:80 \
              amazon-homepage
